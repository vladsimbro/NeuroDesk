<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d2d">
  <meta name="description" content="NeuroDesk — быстрый справочник российской МКБ-10 с поиском по коду и названию диагноза.">
  <title>NeuroDesk — справочник МКБ-10</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="NeuroDesk — главная">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>NeuroDesk</strong><small>NEUROLOGY WORKSPACE</small></span>
      </a>
      <div class="workspace-label">СПРАВОЧНИК</div>
      <nav class="primary-nav" aria-label="Основная навигация">
        <a class="nav-item active" href="#overview" data-route="overview"><span class="nav-icon" data-icon="grid"></span><span>Главная</span></a>
        <a class="nav-item" href="#icd" data-route="icd"><span class="nav-icon" data-icon="book"></span><span>МКБ-10</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="source-status"><span class="status-dot"></span><span><strong>Российская МКБ-10</strong><small>Поиск по классификации</small></span></div>
        <div class="sidebar-foot">NeuroDesk <span>·</span> ранняя версия</div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Открыть меню"><span data-icon="menu"></span></button>
        <div class="breadcrumb"><span>NeuroDesk</span><span class="breadcrumb-sep">/</span><strong id="breadcrumb-current">Обзор</strong></div>
        <div class="topbar-actions">
          <label class="global-search" for="global-search-input"><span data-icon="search"></span><input id="global-search-input" type="search" placeholder="Поиск по NeuroDesk…" autocomplete="off"><kbd>⌘ K</kbd></label>
          <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему"><span data-icon="sun"></span></button>
        </div>
      </header>
      <div class="search-popover" id="search-popover" hidden></div>
      <section class="page-content" id="app-content" aria-live="polite"><div class="loading-state"><span class="loader"></span><span>Загрузка NeuroDesk…</span></div></section>
      <footer class="app-footer">
        <span>NeuroDesk <span class="footer-separator">·</span> Справочник кодов МКБ-10</span>
        <span><span class="footer-dot"></span> Медицинские материалы требуют профессиональной проверки</span>
      </footer>
    </main>
  </div>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
