name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests and syntax checks
        run: npm test
      - name: Exercise site interactions in headless Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/neurodesk-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/tests/browser-smoke.html > /tmp/neurodesk-browser.html 2>/tmp/neurodesk-browser-errors.log
          grep 'id="result"' /tmp/neurodesk-browser.html
          grep -q 'id="result">PASS ' /tmp/neurodesk-browser.html

