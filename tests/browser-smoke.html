<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>NeuroDesk browser smoke test</title>
<style>body{font:16px system-ui;margin:20px}iframe{position:absolute;left:-9999px;top:0;border:0}</style></head>
<body><h1>Browser smoke test</h1><pre id="result">RUNNING</pre>
<script>
(async()=>{
 const checks=[];
 const assert=(condition,message)=>{if(!condition)throw Error(message);checks.push(message)};
 const loadFrame=(url,width=1280,height=850)=>new Promise((resolve,reject)=>{
  const frame=document.createElement('iframe');frame.width=width;frame.height=height;
  frame.style.width=width+'px';frame.style.height=height+'px';
  frame.onload=()=>resolve({frame,doc:frame.contentDocument,win:frame.contentWindow});
  frame.onerror=()=>reject(Error('Frame failed: '+url));
  frame.src=url;document.body.appendChild(frame);
 });
 try{
  const home=await loadFrame('../index.html');
  assert(home.doc.title==='Главная — NeuroDesk','Home JavaScript rendered (title='+home.doc.title+')');
  assert(home.doc.querySelectorAll('.nd-home-gateway').length===2,'Two main sections render');
  assert(home.doc.querySelectorAll('.nd-home-topic-grid a').length===6,'Six real quick article links render');
  const gateways=home.doc.querySelector('.nd-home-gateways');
  assert(gateways.getBoundingClientRect().height>150,'Home cards have usable geometry');
  home.frame.remove();

  const icd=await loadFrame('../index.html?code=G43.1#icd',390,844);
  const waitUntil=async(condition,label)=>{
   for(let attempt=0;attempt<80;attempt++){
    if(condition())return;
    await new Promise(resolve=>setTimeout(resolve,50));
   }
   throw Error('ICD waiting for '+label);
  };
  await waitUntil(()=>icd.doc.getElementById('icd-status')?.textContent.includes('База загружена'),'data loading');
  await waitUntil(()=>!icd.doc.getElementById('icd-entry-detail')?.hidden,'deep-link details');
  assert(icd.doc.querySelectorAll('.icd-chapter').length===22,'ICD has 22 chapter buttons');
  assert(icd.doc.querySelector('[data-icd-chapter="V01-Y98"] .icd-chapter-number')?.textContent==='XX','Chapter XX is external causes');
  assert(icd.doc.querySelector('[data-icd-chapter="Z00-Z99"] .icd-chapter-number')?.textContent==='XXI','Chapter XXI is Z codes');
  assert(icd.doc.querySelector('[data-icd-chapter="U00-U85"] .icd-chapter-number')?.textContent==='XXII','Chapter XXII is U codes');
  const icdDetail=icd.doc.getElementById('icd-entry-detail');
  assert(!icdDetail.hidden&&icdDetail.textContent.includes('G43.1'),'Direct ICD code link opens details');
  assert(icdDetail.querySelectorAll('[data-icd-open]').length>=1,'ICD detail has navigable parent/subcategory links');
  const queryIcd=icd.doc.getElementById('icd-query');
  queryIcd.value='ми';
  queryIcd.dispatchEvent(new icd.win.Event('input',{bubbles:true}));
  await waitUntil(()=>icd.doc.querySelectorAll('#icd-results [data-icd-open]').length>0,'short-fragment search');
  assert(icd.doc.querySelector('#icd-results [data-icd-open]')!==null,'ICD supports short Russian fragments');
  icd.doc.querySelector('[data-icd-chapter="G00-G99"]').click();
  assert(icd.doc.getElementById('icd-class-toolbar').textContent.includes('Болезни нервной системы'),'ICD opens selected chapter');

  const icdTree=icd.doc.getElementById('icd-tree');
  assert(!icdTree.hidden&&icdTree.querySelectorAll('[data-icd-open]').length>0,'Expandable chapter tree is visible');
  const expanding=icdTree.querySelector('[data-icd-expand]');
  assert(!!expanding,'Chapter contains expandable rubric');
  const toggleId=expanding.dataset.icdExpand;
  expanding.click();
  assert(icdTree.querySelector('[data-icd-expand="'+toggleId+'"]')?.getAttribute('aria-expanded')==='true','Chapter tree expands inline');
  assert(queryIcd.value==='ми','Changing chapter preserves user search query');
  assert(icd.doc.getElementById('icd-favorites-count').textContent==='0','Favorites start empty');
  icdDetail.querySelector('#icd-toggle-favorite').click();
  assert(icd.doc.getElementById('icd-favorites-count').textContent==='1','Adding code to favorites updates count');
  icd.doc.getElementById('icd-show-favorites').click();
  assert(!icd.doc.getElementById('icd-personal-content').hidden&&icd.doc.getElementById('icd-personal-content').textContent.includes('G43.1'),'Favorites panel lists saved codes');
  icd.doc.getElementById('icd-reset-chapter').click();
  queryIcd.value='ишемический инсульт';
  queryIcd.dispatchEvent(new icd.win.Event('input',{bubbles:true}));
  await waitUntil(()=>icd.doc.getElementById('icd-search-suggestions').textContent.includes('I63'),'medical terminology search hint');
  assert(icd.doc.getElementById('icd-search-suggestions').textContent.includes('не рекомендации'),'Search hints avoid automatic medical coding');
  assert(!!icd.doc.getElementById('icd-offline-state'),'ICD offline state is accessible');

  const width=icd.doc.documentElement.scrollWidth;
  assert(width<=icd.win.innerWidth+1,'ICD mobile view has no horizontal page overflow');
  icd.frame.remove();

  const clinical=await loadFrame('../clinical.html');
  const {doc,win}=clinical;
  await waitUntil(()=>doc.querySelectorAll('.nd-clinical-card').length===75,'75-item clinical library loaded');
  let cards=[...doc.querySelectorAll('.nd-clinical-card')];
  assert(cards.length===75,'All 75 clinical cards render');
  const initialPositions=cards.slice(0,3).map(card=>card.getBoundingClientRect().top);
  cards[0].click();
  const reader=doc.getElementById('clinical-reader');
  assert(!reader.hidden,'Reader opens');

  assert(doc.querySelectorAll('.nd-article-section').length>=7,'Clinical article contains expanded long-form sections');
  assert(doc.querySelectorAll('.nd-article-source-entry').length>=1,'Clinical article shows individual Russian recommendations');
  assert(doc.querySelector('.nd-article-source-entry a')?.href.includes('minzdrav.gov.ru/special/'),'Russian official source has a direct or registry link');
  assert(doc.querySelector('.nd-article-review-status')?.textContent.includes('рекомендации'),'Source applicability status is disclosed');
  const sourceLinks=[...doc.querySelectorAll('.nd-article-source-entry a')];
  assert(sourceLinks.every(a=>new URL(a.href).host==='minzdrav.gov.ru'),'No non-Russian source links are shown');
  assert(doc.querySelectorAll('.nd-article-toc button').length===doc.querySelectorAll('.nd-article-section').length,'Long article TOC covers all sections');

  assert(win.getComputedStyle(reader).position==='fixed','Reader overlay is fixed');
  assert(doc.querySelectorAll('.nd-reader-tab').length===1,'First article opens one tab');
  cards=[...doc.querySelectorAll('.nd-clinical-card')];
  cards[1].click();
  assert(doc.querySelectorAll('.nd-reader-tab').length===2,'Second article adds a tab');
  const afterPositions=[...doc.querySelectorAll('.nd-clinical-card')].slice(0,3).map(card=>card.getBoundingClientRect().top);
  assert(afterPositions.every((value,index)=>Math.abs(value-initialPositions[index])<2),'Catalog cards do not move while opening articles');
  const tabButtons=[...doc.querySelectorAll('[data-clinical-tab]')];
  tabButtons[0].click();
  assert(doc.querySelector('.nd-reader-tab.is-active [data-clinical-tab]')?.dataset.clinicalTab===tabButtons[0].dataset.clinicalTab,'Tabs switch active article');
  doc.querySelector('[data-clinical-tab-close]').click();
  assert(doc.querySelectorAll('.nd-reader-tab').length===1,'One tab closes independently');
  doc.getElementById('clinical-reader-close').click();
  assert(reader.hidden,'Reader dismisses without losing tabs');
  const reopen=doc.getElementById('clinical-reopen');
  assert(!reopen.hidden,'Reopen control is available');
  reopen.click();
  assert(!reader.hidden&&doc.querySelectorAll('.nd-reader-tab').length===1,'Reopening preserves article state');
  doc.getElementById('clinical-close-all').click();
  assert(reader.hidden&&doc.querySelectorAll('.nd-reader-tab').length===0,'Close all clears the workspace');
  doc.querySelector('[data-clinical-open="mnd"]').click();
  assert(doc.querySelectorAll('.nd-article-section').length>=7,'Article without direct guideline still has full review');
  assert(doc.querySelector('.nd-article-source-warning')?.textContent.includes('не подтверждена'),'Unverified guideline is not presented as official');
  doc.getElementById('clinical-close-all').click();
  doc.querySelector('[data-clinical-open="bppv"]').click();
  assert(doc.querySelector('.nd-article-head h2')?.textContent.includes('позиционное головокружение'),'New BPPV article opens');
  assert(doc.querySelectorAll('.nd-article-section').length>=4,'New BPPV article contains detailed unique sections');
  assert(doc.querySelector('.nd-article-source-warning')?.textContent.includes('не подтверждена'),'Unverified guideline stays explicitly unverified in new article');
  doc.getElementById('clinical-close-all').click();
  doc.querySelector('[data-clinical-open="intracerebral-hemorrhage"]').click();
  assert(doc.querySelector('.nd-article-source-entry')?.textContent.includes('523_3'),'New hemorrhage article links to Russian document ID');
  const copyGuideline=doc.querySelector('[data-clinical-copy-id="523_3"]');
  assert(!!copyGuideline,'Guideline ID copy control is present');
  copyGuideline.click();
  await waitUntil(()=>copyGuideline.textContent.includes('523_3')&&/скопирован|для поиска/.test(copyGuideline.textContent),'copy guideline ID confirmation');
  assert(doc.querySelector('.nd-article-source-actions a')?.href.startsWith('https://minzdrav.gov.ru/special/'),'New article guideline link uses accessible Ministry hub');
  doc.getElementById('clinical-close-all').click();
  doc.querySelector('[data-clinical-open="headache"]').click();
  const related=doc.querySelector('[data-clinical-related]');
  assert(!!related,'Reader suggests related clinical articles using shared medical tags');
  related.click();
  assert(doc.querySelectorAll('.nd-reader-tab').length===2,'Related clinical article opens in a second tab');
  doc.getElementById('clinical-close-all').click();

  const search=doc.getElementById('clinical-query');
  search.value='миастения';search.dispatchEvent(new win.Event('input',{bubbles:true}));
  assert(doc.querySelectorAll('.nd-clinical-card').length>=1,'Search works after closing reader');
  clinical.frame.remove();

  const deep=await loadFrame('../clinical.html?article=stroke&article=cerebral-palsy&active=cerebral-palsy',390,844);
  await waitUntil(()=>deep.doc.getElementById('clinical-reader')&&!deep.doc.getElementById('clinical-reader').hidden,'clinical mobile deep link ready');
  assert(!deep.doc.getElementById('clinical-reader').hidden,'Mobile deep link opens reader');
  assert(deep.doc.querySelectorAll('.nd-reader-tab').length===2,'Mobile deep link preserves two tabs');
  assert(deep.doc.querySelector('.nd-article-head h2')?.textContent.includes('Церебральный паралич'),'One of the 24 new clinical articles opens via mobile deep link');
  assert(deep.doc.querySelector('[data-clinical-copy-id="1087_1"]'),'New pediatric article exposes official Russian guideline identifier');
  const panel=deep.doc.querySelector('.nd-reader-dialog').getBoundingClientRect();
  assert(panel.width<=391&&panel.width>=360,'Reader fits mobile width');
  assert(panel.height>=790,'Reader uses full mobile screen height');
  deep.frame.remove();

  const calcs=await loadFrame('../calculators.html?tool=score2');
  const cdoc=calcs.doc,cwin=calcs.win;
  assert(cdoc.querySelectorAll('.calc-card').length===11,'Eleven clinical calculator cards render');
  assert(cdoc.querySelector('.calc-tool-header h2')?.textContent.includes('SCORE2'),'SCORE2 opens from deep link');
  const fill=(key,value)=>{
   const form=cdoc.getElementById('calc-form');
   const radios=[...form.querySelectorAll('input[type="radio"][name="'+key+'"]')];
   if(radios.length){
    const chosen=radios.find(node=>node.value===value);
    assert(!!chosen,'Radio choice '+key+'='+value+' is available');
    chosen.checked=true;chosen.dispatchEvent(new cwin.Event('change',{bubbles:true}));
    return;
   }
   const element=form.querySelector('[name="'+key+'"]');
   assert(!!element,'Calculator form field '+key+' exists');
   element.value=value;
   element.dispatchEvent(new cwin.Event('change',{bubbles:true}));
  };
  fill('age','60');fill('sex','male');fill('region','moderate');fill('smoker','no');
  fill('sbp','120');fill('total','6');fill('hdl','1.3');
  fill('ascvd','no');fill('diabetes','no');fill('ckd','no');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(!!cdoc.querySelector('.calc-result-value'),'SCORE2 shows computed probability');
  assert(cdoc.querySelector('.calc-result-unit')?.textContent.includes('%'),'SCORE2 percentage is in its own unit line');
  fill('diabetes','yes');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(cdoc.getElementById('calc-result').classList.contains('is-error'),'SCORE2 blocks diabetes input');
  cdoc.querySelector('[data-tool="gcs"]').click();
  assert(cdoc.querySelector('.calc-tool-header h2')?.textContent.includes('GCS'),'GCS opens from catalog');
  assert(cdoc.querySelectorAll('.calc-choice-item input[type="radio"]').length>=17,'GCS uses visible choice cards rather than dropdowns');
  assert(!!cdoc.querySelector('.calc-form-progress progress'),'Progress indicator is present');
  fill('eye','4');fill('verbal','5');fill('motor','6');fill('pupils','0');
  assert(cdoc.getElementById('calc-progress-label').textContent==='4 из 4','GCS confirms all four responses provided');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(cdoc.querySelector('.calc-result-value')?.textContent.includes('15 / 15'),'GCS totals correctly');
  cdoc.getElementById('calc-search').value='МИО';
  cdoc.getElementById('calc-search').dispatchEvent(new cwin.Event('input',{bubbles:true}));
  assert(cdoc.querySelectorAll('.calc-card').length===0,'Calculator search filters cards');
  cdoc.getElementById('calc-search').value='';
  cdoc.getElementById('calc-search').dispatchEvent(new cwin.Event('input',{bubbles:true}));
  cdoc.querySelector('[data-tool="fourat"]').click();
  assert(cdoc.querySelectorAll('input[type="radio"]').length>=9,'4AT provides direct selectable answers');
  fill('alertness','4');fill('orientation','2');fill('attention','2');fill('change','4');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(cdoc.querySelector('.calc-result-value')?.textContent.includes('12 / 12'),'4AT totals all four domains');

  cdoc.querySelector('[data-tool="nrs"]').click();
  const nrsSeven=cdoc.querySelector('input[type="radio"][name="value"][value="7"]');
  assert(!!nrsSeven,'NRS exposes direct numeric choices');
  nrsSeven.checked=true;nrsSeven.dispatchEvent(new cwin.Event('change',{bubbles:true}));
  assert(cdoc.getElementById('calc-progress-label').textContent==='1 из 2','NRS progress counts selected numeric rating');
  const nrsPeriod=cdoc.querySelector('input[name="period"][value="Сейчас"]');
  nrsPeriod.checked=true;nrsPeriod.dispatchEvent(new cwin.Event('change',{bubbles:true}));
  assert(cdoc.getElementById('calc-progress-label').textContent==='2 из 2','NRS progress detects completed form');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(cdoc.querySelector('.calc-score-visual'),'NRS displays a neutral score-position chart');
  cdoc.querySelector('[data-tool="mrc"]').click();
  assert(cdoc.querySelectorAll('.calc-mrc-group').length===6,'MRC presents six bilateral muscle groups');
  assert(cdoc.querySelectorAll('.calc-mrc-sides select').length===12,'MRC retains twelve independent ratings');

  const examples={
   score2:{age:'60',sex:'male',region:'moderate',smoker:'no',sbp:'120',total:'6',hdl:'1,3',ascvd:'no',diabetes:'no',ckd:'no'},
   gcs:{eye:'4',verbal:'5',motor:'6',pupils:'NT'},
   mrs:{grade:'3'},
   abcd2:{age:'60',pressure:'yes',symptom:'weakness',duration:'60',diabetes:'yes'},
   ich:{gcs:'3',age:'80',volume:'30',ivh:'yes',infratentorial:'yes'},
   fourat:{alertness:'4',orientation:'2',attention:'2',change:'4'},
   rass:{grade:'-2'},
   nrs:{value:'7',period:'Сейчас'},
   mrc:Object.fromEntries(Array.from({length:12},(_,i)=>['m'+i,'5'])),
   map:{sbp:'120',dbp:'80'},
   bmi:{weight:'81',height:'180'}
  };
  for(const [id,values] of Object.entries(examples)){
   const entry=cdoc.querySelector('[data-tool="'+id+'"]');
   assert(!!entry,'Calculator '+id+' listed in search');
   entry.click();
   const form=cdoc.getElementById('calc-form');
   assert(!!form,'Calculator '+id+' opened');
   for(const [key,value] of Object.entries(values))fill(key,value);
   form.dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
   const result=cdoc.getElementById('calc-result');
   assert(!!result.querySelector('.calc-result-value'),'Calculator '+id+' calculates result');
   assert(!!result.querySelector('.calc-result-summary'),'Calculator '+id+' explains meaning');
   assert(result.querySelectorAll('.calc-breakdown-row').length>=1,'Calculator '+id+' breaks down result');
   assert(!!result.querySelector('.calc-result-caution'),'Calculator '+id+' provides cautions');
   assert(!!cdoc.querySelector('.calc-help-panel'),'Calculator '+id+' includes assessment guide');
   assert(!!result.querySelector('#calc-copy'),'Calculator '+id+' supports copying full interpretation');
  }
  cdoc.querySelector('[data-tool="mrs"]').click();
  fill('grade','3');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(cdoc.getElementById('calc-result').textContent.includes('ходить без помощи'),'Rankin 3 explicitly describes walking');
  fill('grade','4');
  cdoc.querySelector('[name="grade"]').dispatchEvent(new cwin.Event('change',{bubbles:true}));
  assert(!cdoc.querySelector('.calc-result-value'),'Changing response invalidates stale interpretation');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(cdoc.getElementById('calc-result').textContent.includes('не способен ходить'),'Rankin 4 explains need for support');
  cdoc.getElementById('calc-form').reset();
  await Promise.resolve();
  assert(!cdoc.querySelector('.calc-result-value'),'Form reset clears displayed result');
  cdoc.querySelector('[data-tool="gcs"]').click();
  fill('eye','4');fill('verbal','5');fill('motor','6');fill('pupils','NT');
  cdoc.getElementById('calc-form').dispatchEvent(new cwin.Event('submit',{bubbles:true,cancelable:true}));
  assert(cdoc.getElementById('calc-result').textContent.includes('GCS-P не вычисляется'),'Missing pupil data keeps GCS, does not invent GCS-P');
  calcs.frame.remove();

  const mobileCalc=await loadFrame('../calculators.html?tool=abcd2',390,844);
  assert(mobileCalc.doc.querySelector('.calc-tool-header h2')?.textContent.includes('ABCD'),'Mobile calculator deep link loads');
  const bounds=mobileCalc.doc.querySelector('.calc-detail').getBoundingClientRect();
  assert(bounds.width>250&&bounds.width<=390,'Calculator fits mobile viewport');
  mobileCalc.frame.remove();

  for(const width of [320,375,390,414]){
    const mobileMap=await loadFrame('../calculators.html?tool=map',width,780);
    const mdoc=mobileMap.doc,mwin=mobileMap.win;
    const f=mdoc.getElementById('calc-form');
    assert(!!f,'Mobile '+width+' form loaded');
    f.querySelector('[name="sbp"]').value='120';
    f.querySelector('[name="dbp"]').value='80';
    f.dispatchEvent(new mwin.Event('submit',{bubbles:true,cancelable:true}));
    const number=mdoc.querySelector('.calc-result-metric');
    const unit=mdoc.querySelector('.calc-result-unit');
    const eyebrow=mdoc.querySelector('.calc-result-eyebrow');
    const title=mdoc.querySelector('.calc-result-label');
    const body=mdoc.querySelector('.calc-result-summary');
    assert(!!number&&!!unit&&!!eyebrow&&!!title&&!!body,'Mobile '+width+' renders all result blocks');
    assert(number.textContent==='93,3','Mobile '+width+' shows separate numerical value with comma');
    assert(unit.textContent==='мм рт. ст.','Mobile '+width+' shows units on own line');
    const ab=eyebrow.getBoundingClientRect(),nb=number.getBoundingClientRect(),ub=unit.getBoundingClientRect(),tb=title.getBoundingClientRect();
    assert(nb.top>=ab.bottom-1,'Mobile '+width+' value does not overlap caption');
    assert(ub.top>=nb.bottom-1,'Mobile '+width+' unit below numerical result');
    assert(tb.top>=ub.bottom-1,'Mobile '+width+' title below unit');
    assert([eyebrow,number,unit,title,body].every(node=>{
      const box=node.getBoundingClientRect();
      return box.right<=width+1&&box.left>=-1;
    }),'Mobile '+width+' text stays within viewport');
    assert(mwin.getComputedStyle(mdoc.querySelector('.calc-result-main')).display==='grid','Mobile '+width+' report heading uses separate grid rows');
    assert(mwin.getComputedStyle(mdoc.querySelector('.topbar-actions')).display==='none','Mobile '+width+' topbar does not crowd breadcrumb');
    assert(mdoc.documentElement.scrollWidth<=width+2,'Mobile '+width+' has no horizontal page overflow');
    mobileMap.frame.remove();
  }

  document.getElementById('result').textContent='PASS '+checks.length+' browser checks';
 }catch(error){
  document.getElementById('result').textContent='FAIL after '+checks.length+' checks: '+error.message;
  console.error(error);
 }
})();
</script></body></html>
